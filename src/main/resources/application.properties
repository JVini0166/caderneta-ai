spring.application.name=cadernetaai

# Datasource (env-var style)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://72.60.59.20:5460/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:StqL0SZUKtHS15cB582}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:2}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Security / JWT
app.security.jwt.secret=${JWT_SECRET:change-this-in-prod-please-32bytes-minimum}
app.security.jwt.expiration-minutes=${JWT_EXPIRES_MINUTES:120}
app.security.jwt.issuer=${JWT_ISSUER:CadernetaAI}

# JWT Resource Server (disabled for now to avoid protecting Swagger)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:https://service-auth}
app.security.jwt.expires-in=${JWT_EXPIRES_IN:7d}
app.security.jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN:30d}

# OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
